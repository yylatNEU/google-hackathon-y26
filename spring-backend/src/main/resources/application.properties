spring.application.name=ParkPulseSpringBackend
server.port=${PARKPULSE_SPRING_PORT:8010}

spring.datasource.url=jdbc:sqlite:${PARKPULSE_PLATFORM_DB:/tmp/parkpulse/park_data.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

parkpulse.python-backend-url=${PARKPULSE_PYTHON_BACKEND_URL:http://127.0.0.1:8000}
parkpulse.python-backend-timeout-ms=${PARKPULSE_PYTHON_BACKEND_TIMEOUT_MS:25000}
parkpulse.python-backend-max-body-bytes=${PARKPULSE_PYTHON_BACKEND_MAX_BODY_BYTES:2097152}

management.endpoints.web.exposure.include=health,info
